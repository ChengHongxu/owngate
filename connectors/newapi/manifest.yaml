connector: newapi
version: 1.1.0
title: New API
access: official_api

config:
  base_url: { type: string, format: uri, required: true, label: 站点网址 }
  user_id: { type: string, required: true, label: 用户 ID, help: 在站点"个人设置"中查看 }
  role: { type: string, enum: [user, admin], default: user, label: 连接视角, help: 普通用户选 user，管理访问令牌选 admin；站点仍会校验令牌权限 }
  channel_balance_unit: { type: string, enum: [unknown, USD], default: unknown, label: 管理员渠道余额单位, help: 默认不推测分支或供应商币种；确认站点渠道余额以美元计价后才选择 USD，对账只比较相同单位 }
  quota_per_unit: { type: number, minimum: 0.000001, label: 配额换算比例, help: "自动从站点读取；仅在确认站点设置后手动填写，留空时显示原始 quota" }

auth:
  type: bearer
  fields:
    access_token: { secret: true, label: 系统访问令牌, help: 使用站点个人设置中的管理访问令牌（PAT）；模型调用 API Key 不能替代管理令牌，管理员视角还需相应只读权限 }

discovery:
  quota_ratio: { path: /api/status, from: $.data.quota_per_unit }

verification:
  capabilities: [account.balance]
  auth: account.balance

views:
  - id: channel-upstreams
    type: comparison
    title: 渠道与上游对账
    description: 明确选择独立授权的上游，仅在单位一致时比较缓存值与当前值；采样时间不同，差额仅供核对。
    source:
      capability: channel.list
      items: channels
      id: id
      label: name
      value: balance
      updated_at: balance_updated_time
      updated_at_format: unix_seconds
      unit: { config: channel_balance_unit, allowed: [USD] }
    detail: { capability: channel.balance, input: channel_id, id: id }
    target: { capability: account.balance, value: quota }

http:
  base: "{{config.base_url}}"
  headers:
    Authorization: "Bearer {{secret.access_token}}"
    New-Api-User: "{{config.user_id}}"
  rate_limit: { rpm: 60 }
  timeout_ms: 10000

capabilities:
  - id: account.balance
    roles: [user, admin]
    kind: query
    effect: read
    cache: { ttl: 300 }
    title: 账户余额
    description: 查询当前用户的配额余额与用量统计
    request:
      method: GET
      path: /api/user/self
    success_when: "$.success == true"
    auth_failed_when: "status == 401"
    presentation:
      type: stats
      fields:
        - { path: quota, label: 账户余额, format: number, prominent: true }
        - { path: username, label: 用户名 }
        - { path: email, label: 邮箱 }
    output:
      quota:
        from: $.data.quota
        type: number
        transform: quota_to_usd
        unit: USD
        scope: account
        sensitivity: financial
      username:
        from: $.data.username
        unit: ''
        scope: account
        sensitivity: pii
      email:
        from: $.data.email
        unit: ''
        scope: account
        sensitivity: pii
    data_time: { now: true }

  - id: account.usage
    roles: [user, admin]
    kind: query
    effect: read
    cache: { ttl: 120 }
    title: 账户已用额度
    description: 查询当前账户累计用量和请求数；换算比例未知时保留原始 quota
    request: { method: GET, path: /api/user/self }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation:
      type: stats
      fields:
        - { path: used_quota, label: 已用额度, format: number, prominent: true }
        - { path: request_count, label: 请求数, format: number }
    output:
      used_quota: { from: $.data.used_quota, type: number, transform: quota_to_usd, unit: USD, scope: account, sensitivity: financial }
      request_count: { from: $.data.request_count, type: integer, unit: requests, scope: account }

  - id: model.list
    roles: [user, admin]
    kind: query
    effect: read
    cache: { ttl: 300 }
    title: 可用模型
    description: 查询当前用户分组可用的模型名称
    request: { method: GET, path: /api/user/models }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation: { type: list, items: $.models, max_rows: 5 }
    output:
      models:
        from: $.data
        schema: { type: [array, 'null'], items: { type: string } }

  - id: model.prices
    roles: [user, admin]
    kind: query
    effect: read
    cache: { ttl: 300 }
    title: 模型价格与倍率
    description: 保留站点声明的 quota_type、model_price 与倍率；不将按次价格、token 倍率或分组倍率混为同一单位
    request: { method: GET, path: /api/pricing }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation:
      type: table
      items: $.models
      max_rows: 5
      columns:
        - { path: model_name, label: 模型 }
        - { path: quota_type, label: 计费类型 }
        - { path: model_price, label: 站点价格, format: number }
        - { path: model_ratio, label: 输入倍率, format: number }
        - { path: completion_ratio, label: 输出倍率, format: number }
        - { path: cache_ratio, label: 缓存倍率, format: number }
    output:
      models:
        from: $.data
        sensitivity: financial
        schema:
          type: [array, 'null']
          items:
            type: object
            required: [model_name]
            additionalProperties: false
            properties:
              model_name: { type: string }
              quota_type: { type: integer }
              model_price: { type: number, x-unit: site_price, x-sensitivity: financial }
              model_ratio: { type: number, x-unit: ratio, x-sensitivity: financial }
              completion_ratio: { type: number, x-unit: ratio, x-sensitivity: financial }
              cache_ratio: { type: [number, 'null'], x-unit: ratio }
              enable_groups: { type: array, items: { type: string } }

  - id: usage.logs
    roles: [user, admin]
    kind: query
    effect: read
    cache: null
    title: 个人用量记录
    description: 分页查询个人消耗日志，时间使用 Unix 秒；默认每页 20 条，不返回原始日志正文、IP、令牌或内部 other 字段
    input: &usage_input
      type: object
      additionalProperties: false
      required: [start_timestamp, end_timestamp]
      properties:
        page: { type: integer, minimum: 1, maximum: 100000, default: 1, title: 页码 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 20, title: 每页条数 }
        start_timestamp: { type: integer, minimum: 0, title: 开始时间（Unix 秒） }
        end_timestamp: { type: integer, minimum: 1, title: 结束时间（Unix 秒） }
        model_name: { type: string, maxLength: 150, default: '', title: 模型筛选（留空不限） }
    request: { method: GET, path: '/api/log/self?type=2&p={{input.page}}&page_size={{input.page_size}}&start_timestamp={{input.start_timestamp}}&end_timestamp={{input.end_timestamp}}&model_name={{input.model_name}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation: &usage_table
      type: table
      items: $.records
      max_rows: 5
      columns:
        - { path: created_at, label: 时间, format: datetime }
        - { path: model_name, label: 模型 }
        - { path: quota, label: 消耗, format: number }
        - { path: prompt_tokens, label: 输入 token, format: number }
        - { path: completion_tokens, label: 输出 token, format: number }
    output: &usage_output
      total: { from: $.data.total, type: integer, unit: records }
      records:
        from: $.data.items
        sensitivity: financial
        schema:
          type: [array, 'null']
          items:
            type: object
            required: [id]
            additionalProperties: false
            properties:
              id: { type: integer }
              created_at: { type: integer, x-unit: unix_seconds }
              type: { type: integer }
              model_name: { type: string }
              quota: { type: number, x-unit: quota, x-sensitivity: financial }
              prompt_tokens: { type: integer, x-unit: tokens }
              completion_tokens: { type: integer, x-unit: tokens }
              use_time: { type: integer, x-unit: seconds }
              channel: { type: integer }
              user_id: { type: integer, x-sensitivity: pii }
              username: { type: string, x-sensitivity: pii }

  - id: usage.summary
    roles: [user, admin]
    kind: query
    effect: read
    cache: null
    title: 个人时段用量
    description: 按时间与模型统计个人消耗，金额只在确认换算比例后换算
    input: *usage_input
    request: { method: GET, path: '/api/log/self/stat?type=2&start_timestamp={{input.start_timestamp}}&end_timestamp={{input.end_timestamp}}&model_name={{input.model_name}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation: &usage_stats
      type: stats
      fields:
        - { path: quota, label: 时段用量, format: number, prominent: true }
        - { path: rpm, label: 请求速率, format: number }
        - { path: tpm, label: token 速率, format: number }
    output: &stats_output
      quota: { from: $.data.quota, type: number, transform: quota_to_usd, unit: USD, scope: period, sensitivity: financial }
      rpm: { from: $.data.rpm, type: number, unit: requests_per_minute }
      tpm: { from: $.data.tpm, type: number, unit: tokens_per_minute }

  - id: system.status
    roles: [admin]
    kind: query
    effect: read
    cache: { ttl: 30 }
    title: 管理员系统健康
    description: 检查站点数据库和服务可用性，不调用任何渠道测试或更新接口
    request: { method: GET, path: /api/status/test }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation:
      type: stats
      fields:
        - { path: available, label: 服务可用, format: badge }
    output:
      available: { from: $.success, type: boolean }

  - id: channel.list
    roles: [admin]
    kind: query
    effect: read
    cache: { ttl: 60 }
    title: 管理员渠道列表
    description: 分页查询渠道与缓存余额；明确排除 key、header_override、setting 等含秘密字段
    input:
      type: object
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 1, maximum: 100000, default: 1, title: 页码 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 20, title: 每页条数 }
    request: { method: GET, path: '/api/channel/?p={{input.page}}&page_size={{input.page_size}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation:
      type: table
      items: $.channels
      max_rows: 5
      columns:
        - { path: name, label: 渠道 }
        - { path: type, label: 类型 }
        - { path: status, label: 状态, format: badge }
        - { path: balance, label: 缓存余额, format: number }
        - { path: used_quota, label: 累计用量, format: number }
    output:
      total: { from: $.data.total, type: integer, unit: channels }
      channels:
        from: $.data.items
        sensitivity: financial
        schema:
          type: [array, 'null']
          items:
            type: object
            required: [id]
            additionalProperties: false
            properties:
              id: { type: integer }
              name: { type: string }
              type: { type: integer }
              status: { type: integer }
              balance: { type: number, x-unit: site_balance, x-sensitivity: financial }
              balance_updated_time: { type: integer, x-unit: unix_seconds }
              used_quota: { type: number, x-unit: quota, x-sensitivity: financial }
              models: { type: string }

  - id: channel.balance
    roles: [admin]
    kind: query
    effect: read
    cache: { ttl: 60 }
    title: 管理员渠道缓存余额
    description: 只读取站点已缓存的余额与更新时间，不触发 update_balance；分支或币种未确认时不参与跨连接金额比较
    input:
      type: object
      additionalProperties: false
      required: [channel_id]
      properties:
        channel_id: { type: integer, minimum: 1, title: 渠道 ID }
    request: { method: GET, path: '/api/channel/{{input.channel_id}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation:
      type: stats
      fields:
        - { path: name, label: 渠道 }
        - { path: balance, label: 缓存余额, format: number, prominent: true }
        - { path: balance_updated_time, label: 更新时间, format: datetime }
    output:
      id: { from: $.data.id, type: integer }
      name: { from: $.data.name }
      balance: { from: $.data.balance, type: number, unit: site_balance, sensitivity: financial }
      balance_updated_time: { from: $.data.balance_updated_time, type: integer, unit: unix_seconds }

  - id: admin.logs
    roles: [admin]
    kind: query
    effect: read
    cache: null
    title: 管理员用量日志
    description: 按时间、模型和渠道查询消耗日志；不返回完整正文、请求头、IP 或秘密字段
    input: &admin_usage_input
      type: object
      additionalProperties: false
      required: [start_timestamp, end_timestamp]
      properties:
        page: { type: integer, minimum: 1, maximum: 100000, default: 1, title: 页码 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 20, title: 每页条数 }
        start_timestamp: { type: integer, minimum: 0, title: 开始时间（Unix 秒） }
        end_timestamp: { type: integer, minimum: 1, title: 结束时间（Unix 秒） }
        model_name: { type: string, maxLength: 150, default: '', title: 模型筛选（留空不限） }
        channel_id: { type: integer, minimum: 0, default: 0, title: 渠道 ID（0 表示全部） }
    request: { method: GET, path: '/api/log/?type=2&p={{input.page}}&page_size={{input.page_size}}&start_timestamp={{input.start_timestamp}}&end_timestamp={{input.end_timestamp}}&model_name={{input.model_name}}&channel={{input.channel_id}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation: *usage_table
    output: *usage_output

  - id: admin.usage
    roles: [admin]
    kind: query
    effect: read
    cache: null
    title: 管理员时段用量
    description: 按时间、渠道与模型统计整个站点消耗
    input: *admin_usage_input
    request: { method: GET, path: '/api/log/stat?type=2&start_timestamp={{input.start_timestamp}}&end_timestamp={{input.end_timestamp}}&model_name={{input.model_name}}&channel={{input.channel_id}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation: *usage_stats
    output: *stats_output

  - id: admin.users
    roles: [admin]
    kind: query
    effect: read
    cache: null
    title: 管理员用户额度列表
    description: 分页查询用户额度，只显示声明的用户标识、额度与角色；不读取密码、PAT 或其他账户绑定信息
    input:
      type: object
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 1, maximum: 100000, default: 1, title: 页码 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 20, title: 每页条数 }
    request: { method: GET, path: '/api/user/?p={{input.page}}&page_size={{input.page_size}}' }
    success_when: '$.success == true'
    auth_failed_when: 'status == 401 or status == 403'
    presentation:
      type: table
      items: $.users
      max_rows: 5
      columns:
        - { path: username, label: 用户名 }
        - { path: role, label: 角色 }
        - { path: status, label: 状态, format: badge }
        - { path: quota, label: 剩余额度, format: number }
        - { path: used_quota, label: 已用额度, format: number }
        - { path: request_count, label: 请求数, format: number }
    output:
      total: { from: $.data.total, type: integer, unit: users }
      users:
        from: $.data.items
        sensitivity: financial
        schema:
          type: [array, 'null']
          items:
            type: object
            required: [id]
            additionalProperties: false
            properties:
              id: { type: integer, x-sensitivity: pii }
              username: { type: string, x-sensitivity: pii }
              display_name: { type: string, x-sensitivity: pii }
              role: { type: integer }
              status: { type: integer }
              quota: { type: number, x-unit: quota, x-sensitivity: financial }
              used_quota: { type: number, x-unit: quota, x-sensitivity: financial }
              request_count: { type: integer, x-unit: requests }
