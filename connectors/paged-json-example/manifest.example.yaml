connector: paged-json-example
version: 1.0.0
title: 分页 JSON API 示例
access: official_api
config:
  base_url: { type: string, format: uri, required: true, label: 自建 API 地址 }
auth:
  type: bearer
  fields:
    access_token: { secret: true, required: true, label: API 只读令牌 }
http:
  base: "{{config.base_url}}"
  headers: { Authorization: "Bearer {{secret.access_token}}" }
  rate_limit: { rpm: 10 }
  timeout_ms: 5000
capabilities:
  - id: records.list
    title: 查看记录
    description: 只读取显式声明的三页，每页最多 50 条，不代表完整历史。
    kind: query
    effect: read
    long_running: true
    cache: { ttl: 60 }
    request:
      method: ADAPTER
      path: /api/records?page=1
      readonly_paths:
        - /api/records?page=2
        - /api/records?page=3
    input: { type: object, additionalProperties: false }
    output:
      items:
        from: $.items
        sensitivity: content
        schema:
          type: array
          maxItems: 150
          items:
            type: object
            additionalProperties: false
            required: [id, title]
            properties:
              id: { type: string, maxLength: 200, x-sensitivity: content, x-untrusted: true }
              title: { type: [string, "null"], maxLength: 500, x-sensitivity: content, x-untrusted: true }
      truncated: { from: $.truncated, type: boolean, sensitivity: content }
