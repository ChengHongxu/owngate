# nginx 反代配置示例
# 将此文件内容加入你的 nginx 配置（sites-available 或 include 目录）
# 假设 Let's Encrypt 证书已由 certbot 管理

server {
    listen 80;
    server_name ${OWNGATE_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${OWNGATE_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${OWNGATE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${OWNGATE_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # owngate-server HTTP 端口（与 PORT 环境变量一致）
    set $upstream http://127.0.0.1:3000;

    # 短期凭据句柄只供内部 HTTP runtime 使用，不能通过反代公开。
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }

    # MCP Streamable HTTP 与普通 REST 共用同一 upstream
    location / {
        proxy_pass       $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # CDP screencast WebSocket（/ws/screen/:connectionId）
    location /ws/ {
        proxy_pass          $upstream;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }
}
