name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release tag
        id: version
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { validateVersion } from './scripts/release-bundle.mjs';
          const version = process.env.GITHUB_REF_NAME.slice(1);
          validateVersion(version);
          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nowner=${owner}\nprerelease=${version.includes('-')}\n`);
          JS

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      IMAGE_PREFIX: ghcr.io/${{ needs.metadata.outputs.owner }}/owngate
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refuse to overwrite an existing release
        run: |
          node --input-type=module <<'JS'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(process.env.GITHUB_REF_NAME)}`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404) {
            throw new Error(response.ok ? 'This version already has a Release; publish a new version instead.' : `Cannot verify release status: HTTP ${response.status}`);
          }
          JS
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-server:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server
      - name: Build browser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/browser/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-browser:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-browser
          cache-to: type=gha,mode=max,scope=release-browser
      - name: Build HTTP runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/runtime-http/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-http-runtime:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-http-runtime
          cache-to: type=gha,mode=max,scope=release-http-runtime
      - name: Build egress proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/egress-proxy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-egress:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-egress
          cache-to: type=gha,mode=max,scope=release-egress
      - name: Verify exact release images
        run: |
          node scripts/deploy-smoke.mjs --image "${IMAGE_PREFIX}-server:${VERSION}"
          node scripts/browser-smoke.mjs --image "${IMAGE_PREFIX}-browser:${VERSION}" --egress-image "${IMAGE_PREFIX}-egress:${VERSION}"
          node scripts/http-runtime-smoke.mjs --server-image "${IMAGE_PREFIX}-server:${VERSION}" --runtime-image "${IMAGE_PREFIX}-http-runtime:${VERSION}"
      - name: Package deployment files
        env:
          RELEASE_OWNER: ${{ needs.metadata.outputs.owner }}
        run: |
          node scripts/release-bundle.mjs --version "$VERSION" --owner "$RELEASE_OWNER" --out out/release
          tar -xzf "out/release/owngate-deploy-${VERSION}.tar.gz" -C out/release
          docker compose --env-file "out/release/owngate-deploy-${VERSION}/.env.example" -f "out/release/owngate-deploy-${VERSION}/compose.yaml" config --quiet
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested images
        run: |
          for service in server browser http-runtime egress; do
            docker push "${IMAGE_PREFIX}-${service}:${VERSION}"
          done
      - name: Publish GitHub Release
        env:
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          flags=()
          if [ "$RELEASE_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "out/release/owngate-deploy-${VERSION}.tar.gz" out/release/SHA256SUMS out/release/install.sh \
            --verify-tag --title "OwnGate ${VERSION}" --generate-notes "${flags[@]}"
